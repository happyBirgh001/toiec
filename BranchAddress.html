<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Address - English Ms.Thuy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { min-height: 100vh; display: flex; flex-direction: column; background: #f5f7fb; color: #333; }

        header { background: #2563eb; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; color: #fff; }
        header h1 { font-size: 24px; }
        nav { display: flex; gap: 20px; }
        nav a { color: #fff; text-decoration: none; font-weight: 500; font-size: 15px; padding-bottom: 4px; border-bottom: 2px solid transparent; transition: 0.3s; }
        nav a:hover, nav a.active { border-bottom: 2px solid #fff; }

        .container { flex: 1; width: 90%; max-width: 900px; margin: 40px auto; }
        
        .branch-card { background: #fff; padding: 25px; border-radius: 16px; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-left: 5px solid #2563eb; }
        .branch-card h2 { color: #2563eb; margin-bottom: 10px; }
        .branch-card p { margin-bottom: 5px; color: #555; }
        
        .map-box { margin-bottom: 40px; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        iframe { width: 100%; height: 350px; border: 0; display: block; }

        .logout-btn { display: block; margin: 20px auto; padding: 10px 25px; background: #fff; color: #2563eb; border: 2px solid #2563eb; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .logout-btn:hover { background: #2563eb; color: #fff; }
        footer { text-align: center; padding: 20px; background: #0f172a; color: #fff; font-size: 14px; }
    </style>
</head>
<body>
