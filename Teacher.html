<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers - English Ms.Thuy</title>
    <!-- Thêm Tailwind để quản lý menu -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { min-height: 100vh; display: flex; flex-direction: column; background: #f5f7fb; color: #333; }

        .container { flex: 1; width: 90%; max-width: 1000px; margin: 40px auto; }
        .teacher-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .teacher-card { background: #fff; border-radius: 16px; padding: 25px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.3s; }
        .teacher-card:hover { transform: translateY(-10px); }
        .teacher-card img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; margin: 0 auto 15px; border: 4px solid #f5f7fb; }
        .teacher-card h3 { color: #2563eb; margin-bottom: 8px; }
        .teacher-card p { color: #666; font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>

<!-- Navbar chuẩn hóa -->
<nav class="bg-blue-600 p-4 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="text-xl font-bold">Ms.Thuy English</div>
        
        <!-- Hamburger cho Mobile -->
        <button id="menuBtn" class="md:hidden text-2xl">☰</button>

        <!-- Menu Desktop -->
        <div class="hidden md:flex space-x-6 font-medium">
            <a href="profile.html">Profile</a>
            <a href="Schedule.html">Schedule</a>
            <a href="Teachers.html" class="border-b-2 border-white">Teachers</a>
            <a href="BranchAddress.html">Address</a>
        </div>
    </div>

    <!-- Menu Mobile -->
    <div id="navMenu" class="fixed top-0 left-[-100%] h-full w-[200px] bg-blue-700 p-8 transition-all duration-300 z-50 flex flex-col space-y-4">
        <button id="closeBtn" class="text-left text-2xl mb-4">✕</button>
        <a href="profile.html">Student Profile</a>
        <a href="Schedule.html">Schedule</a>
        <a href="Teachers.html">Teachers</a>
        <a href="BranchAddress.html">Address</a>
    </div>
</nav>

<div class="container">
    <div class="teacher-list">
        <div class="teacher-card">
            <img src="images/teacher1.jpg" alt="Ms.Thuy">
            <h3>Ms.Thuy</h3>
            <p>IELTS 8.0</p>
            <p>15 năm kinh nghiệm</p>
        </div>

        <div class="teacher-card">
            <img src="images/teacher2.jpg" alt="David Brown">
            <h3>David Brown</h3>
            <p>TESOL Certified</p>
            <p>7 năm kinh nghiệm</p>
        </div>  
    </div>
</div>

<footer class="text-center p-5 bg-slate-900 text-white text-sm">© 2019 English Ms.Thuy</footer>

<script>
    // Logic Menu Mobile
    const menuBtn = document.getElementById('menuBtn');
    const closeBtn = document.getElementById('closeBtn');
    const navMenu = document.getElementById('navMenu');

    menuBtn.addEventListener('click', () => {
        navMenu.classList.replace('left-[-100%]', 'left-0');
    });

    closeBtn.addEventListener('click', () => {
        navMenu.classList.replace('left-0', 'left-[-100%]');
    });

    // Hàm logout thống nhất
    function logout() {
        sessionStorage.clear();
        window.location.href = "login.html";
    }
</script>

</body>
</html>
