<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers - English Ms.Thuy</title>
    <style>
        /* CSS đồng bộ với các trang khác */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { min-height: 100vh; display: flex; flex-direction: column; background: #f5f7fb; color: #333; }

        header { background: #2563eb; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; color: #fff; }
        header h1 { font-size: 24px; }
        nav { display: flex; gap: 20px; }
        nav a { color: #fff; text-decoration: none; font-weight: 500; font-size: 15px; padding-bottom: 4px; border-bottom: 2px solid transparent; transition: 0.3s; }
        nav a:hover, nav a.active { border-bottom: 2px solid #fff; }

        .container { flex: 1; width: 90%; max-width: 1000px; margin: 40px auto; }
        
        /* Teacher List Grid */
        .teacher-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .teacher-card { background: #fff; border-radius: 16px; padding: 25px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.3s; }
        .teacher-card:hover { transform: translateY(-10px); }
        .teacher-card img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 4px solid #f5f7fb; }
        .teacher-card h3 { color: #2563eb; margin-bottom: 8px; }
        .teacher-card p { color: #666; font-size: 14px; margin-bottom: 5px; }

        .logout-btn { display: block; margin: 40px auto; padding: 10px 25px; background: #fff; color: #2563eb; border: 2px solid #2563eb; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .logout-btn:hover { background: #2563eb; color: #fff; }
        footer { text-align: center; padding: 20px; background: #0f172a; color: #fff; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <h1>English Ms.Thuy</h1>
    <nav>
        <a href="profile.html">Student Profile</a>
        <a href="Schedule.html">Schedule</a>
        <a href="Teachers.html" class="active">Teachers</a>
        <a href="BranchAddress.html">Branch Address</a>
    </nav>
</header>

<div class="container">
    <div class="teacher-list">
        <div class="teacher-card">
            <img src="images/teacher1.jpg" alt="Ms.Thuy">
            <h3>Ms.Thuy</h3>
            <p>IELTS 8.0</p>
            <p>15 năm kinh nghiệm</p>
        </div>

        <div class="teacher-card">
            <img src="images/teacher2.jpg" alt="David Brown">
            <h3>David Brown</h3>
            <p>TESOL Certified</p>
            <p>7 năm kinh nghiệm</p>
        </div>  
    </div>

    
</div>

<footer>© 2019 English Ms.Thuy</footer>

<script>
    function logout(){
        localStorage.removeItem("login");
        window.location.href = "login.html";
    }
</script>

</body>
</html>
