<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Student Profile - English Ms.Thuy</title>
    <!-- Thư viện Font Awesome để hiển thị icon con mắt -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; min-height: 100vh; display: flex; flex-direction: column; }

        header { background-color: #2563eb; color: white; padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 24px; }
        nav { display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; font-weight: 500; padding-bottom: 4px; border-bottom: 2px solid transparent; transition: 0.3s; }
        nav a.active { border-bottom: 2px solid white; }
        nav a:hover { border-bottom: 2px solid white; }

        .profile-container { width: 90%; max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #2563eb; margin-bottom: 20px; object-fit: cover; }
        .info { margin-bottom: 20px; color: #555; line-height: 2; text-align: left; display: inline-block; }
        
        .logout-btn { padding: 10px 30px; background: #dc2626; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        .logout-btn:hover { background: #b91c1c; }
        
        /* Chỉnh icon */
        .toggle-icon { cursor: pointer; color: #2563eb; margin-left: 10px; }
    </style>
</head>

<script>
    function togglePhone() {
        const phoneText = document.getElementById("phone-text");
        const icon = document.getElementById("toggle-icon");
        
        // Số điện thoại thật của bạn
        const realPhone = "0708042310"; 
        const hiddenPhone = "07******10";

        if (phoneText.innerText === hiddenPhone) {
            phoneText.innerText = realPhone;
            icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            phoneText.innerText = hiddenPhone;
            icon.classList.replace("fa-eye-slash", "fa-eye");
        }
    }

    function logout(){
        localStorage.removeItem("login");
        window.location.href = "login.html";
    }
    function logout(){

}
function logout() {

</script>
